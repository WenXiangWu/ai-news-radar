name: Publish Radar Snapshot

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Which finished fetch to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - news
          - radar
  workflow_call:
    inputs:
      owner:
        description: "news, radar, or all"
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      deepseek: ${{ steps.check.outputs.deepseek }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read runtime config
        id: check
        run: python3 scripts/runtime_gate.py --workflow update-publish --event "${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'workflow_call' }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish ready snapshots
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_BRANCH: ${{ vars.GITEE_BRANCH }}
          GITEE_DATA_PATH: ${{ vars.GITEE_DATA_PATH }}
          PUBLISH_OWNER: ${{ inputs.owner }}
          WAY_SITE_SYNC_URL: ${{ vars.WAY_SITE_SYNC_URL }}
          WAY_SITE_SYNC_TOKEN: ${{ secrets.WAY_SITE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/pending-publish data/workflow-status /tmp
          ready="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          owner = os.environ.get("PUBLISH_OWNER") or "all"
          wanted = {"news": "update-news", "radar": "update-radar"}.get(owner)
          count = 0
          ids = []
          for path in sorted(Path("data/pending-publish").glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("ready") is not True:
                  continue
              if wanted and payload.get("workflow_id") != wanted:
                  continue
              count += 1
              ids.extend(payload.get("source_ids") or [])
          Path("/tmp/publish-source-ids.json").write_text(json.dumps(ids), encoding="utf-8")
          Path("/tmp/publish-owner.txt").write_text(wanted or "", encoding="utf-8")
          print(count)
          PY
          )"
          if [ "$ready" = "0" ]; then
            echo "No ready pending files for ${PUBLISH_OWNER}"
            exit 0
          fi
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_REPO:-}" ]; then
            echo "GITEE_REPO is not configured"
            exit 1
          fi
          branch="${GITEE_BRANCH:-master}"
          dest="${GITEE_DATA_PATH:-frontend/frontier/radar-data}"
          work=/tmp/way-to-agentic-mirror
          rm -rf "$work"
          git clone --depth 1 --branch "$branch" \
            "https://Michaelwwx:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" "$work"
          mkdir -p "$work/$dest"
          for f in daily-brief.json stories-merged.json source-status.json latest-24h.json top3-personas.json hub.json job-report.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "$work/$dest/$f"
            fi
          done
          for dir in dailies hot topics weekly monthly; do
            if [ -d "data/$dir" ]; then
              rm -rf "$work/$dest/$dir"
              cp -R "data/$dir" "$work/$dest/$dir"
            fi
          done
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add "$dest"
          if git -C "$work" diff --cached --quiet; then
            echo "No site snapshot changes"
          else
            git -C "$work" commit -m "chore: publish radar snapshot"
            git -C "$work" push origin "HEAD:$branch"
          fi
          if [ -n "${WAY_SITE_SYNC_URL:-}" ] && [ -n "${WAY_SITE_SYNC_TOKEN:-}" ]; then
            curl -fsS -m 120 -X POST "$WAY_SITE_SYNC_URL" \
              -H "Authorization: Bearer ${WAY_SITE_SYNC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              || echo "::warning::Way did not pull the new snapshot"
          else
            echo "Way site sync hook is not configured; the site interval pull will pick this up"
          fi
          owner_id="$(cat /tmp/publish-owner.txt)"
          if [ -n "$owner_id" ]; then
            python scripts/publish_pending.py --directory data/pending-publish --workflow-id "$owner_id"
          else
            python scripts/publish_pending.py --directory data/pending-publish
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          ids = json.loads(Path("/tmp/publish-source-ids.json").read_text(encoding="utf-8"))
          owner = Path("/tmp/publish-owner.txt").read_text(encoding="utf-8").strip() or "all"
          status_path = Path("data/workflow-status/update-publish.json")
          previous = {}
          if status_path.is_file():
              previous = json.loads(status_path.read_text(encoding="utf-8"))
          by_owner = {}
          push = previous.get("push") if isinstance(previous.get("push"), dict) else {}
          if push.get("ok") and isinstance(push.get("by_owner"), dict):
              by_owner.update(push["by_owner"])
          by_owner[owner] = ids
          merged = []
          for owner_ids in by_owner.values():
              merged.extend(owner_ids or [])
          payload = {
              "workflow_id": "update-publish",
              "name": "站点推送",
              "schedule": "after-fetch",
              "combined_lanes": [],
              "conclusion": "success",
              "push": {"attempted": True, "ok": True, "source_ids": merged, "by_owner": by_owner},
              "sources": [{"source_id": source_id, "status": "success", "run_kind": "incremental"} for source_id in merged],
          }
          Path("/tmp/publish-status.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          python scripts/write_workflow_status.py \
            --out data/workflow-status/update-publish.json \
            --payload /tmp/publish-status.json \
            --run-id "${{ github.run_id }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record publish failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "workflow_id": "update-publish",
              "name": "站点推送",
              "schedule": "after-fetch",
              "combined_lanes": [],
              "conclusion": "failure",
              "push": {"attempted": True, "ok": False, "source_ids": []},
              "sources": [],
          }
          Path("/tmp/publish-status.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          python scripts/write_workflow_status.py \
            --out data/workflow-status/update-publish.json \
            --payload /tmp/publish-status.json \
            --run-id "${{ github.run_id }}" \
            --html-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit publish result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflow-status/update-publish.json data/pending-publish || true
          if git diff --cached --quiet; then
            echo "No publish status to commit"
            exit 0
          fi
          git commit -m "chore: record radar publish"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
