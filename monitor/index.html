<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Radar 同步监控</title>
  <link rel="stylesheet" href="./monitor.css?v=20260923-tabs">
</head>
<body>
  <main class="monitor-page">
    <header class="monitor-hero">
      <div>
        <p class="eyebrow">RADAR CONTROL PLANE</p>
        <h1>Radar 数据同步监控</h1>
        <p class="monitor-lead">注册、对照、今日执行、历史报告和翻译配置分开展示。</p>
      </div>
      <div class="hero-actions">
        <span id="snapshotMeta" class="muted">正在加载…</span>
        <a id="runAllBtn" class="primary-action" href="https://github.com/WenXiangWu/ai-news-radar/actions/workflows/update-news.yml" target="_blank" rel="noopener noreferrer">
          在 GitHub Actions 中执行
        </a>
      </div>
    </header>

    <section class="kpi-grid" id="kpis" aria-label="运行概览"></section>

    <nav class="monitor-tabs" id="monitorTabs" aria-label="监控分区">
      <button type="button" data-tab="today" aria-selected="true">今日执行</button>
      <button type="button" data-tab="registry">注册信息</button>
      <button type="button" data-tab="coverage">Way 对照</button>
      <button type="button" data-tab="reports">历史报告</button>
      <button type="button" data-tab="config">配置</button>
    </nav>

    <section class="tab-panel" id="panel-today" data-tab-panel="today">
      <div class="section-heading section-heading-wrap">
        <div>
          <h2>今日执行</h2>
        </div>
        <div class="table-tools">
          <label class="sr-only" for="todayWorkflowFilter">按 workflow 筛选</label>
          <select id="todayWorkflowFilter" aria-label="按 workflow 筛选">
            <option value="">全部 workflow</option>
          </select>
          <label class="sr-only" for="todayStatusFilter">按结果筛选</label>
          <select id="todayStatusFilter" aria-label="按结果筛选">
            <option value="">全部结果</option>
            <option value="success">成功</option>
            <option value="failed">失败</option>
          </select>
          <label class="sr-only" for="todayQuery">筛选今日消息</label>
          <input id="todayQuery" type="search" placeholder="筛选源、错误或运行类型">
        </div>
      </div>
      <div class="table-wrap">
        <table class="module-table">
          <thead>
            <tr>
              <th>Workflow</th>
              <th>时刻</th>
              <th>结论</th>
              <th>推送</th>
              <th>记录</th>
            </tr>
          </thead>
          <tbody id="workflowCards"></tbody>
        </table>
      </div>
      <div class="table-wrap today-messages">
        <table class="source-table">
          <thead>
            <tr>
              <th>Workflow</th>
              <th>数据源</th>
              <th>状态</th>
              <th>运行类型</th>
              <th>基线</th>
              <th>错误</th>
            </tr>
          </thead>
          <tbody id="todayMessages"></tbody>
        </table>
      </div>
      <p id="todayEmpty" class="empty-state" hidden>没有符合条件的今日消息。</p>
      <div class="monitor-section">
        <div class="section-heading">
          <h2>每日更新</h2>
          <a id="latestReportLink" class="quiet-link" href="../data/radar-update-report.json">打开完整报告</a>
        </div>
        <div id="runSummary" class="run-summary" hidden></div>
        <span id="runStatus" class="status-chip" hidden>待加载</span>
        <div id="dailyModules" class="module-log"></div>
      </div>
    </section>

    <section class="tab-panel" id="panel-registry" data-tab-panel="registry" hidden>
      <div class="section-heading">
        <h2>模块总览</h2>
      </div>
      <div class="table-wrap">
        <table class="module-table">
          <thead>
            <tr>
              <th>模块</th>
              <th>类型</th>
              <th>状态</th>
              <th>任务</th>
              <th>数据源</th>
            </tr>
          </thead>
          <tbody id="moduleTable"></tbody>
        </table>
      </div>
      <div class="section-heading section-heading-wrap registry-sources">
        <div>
          <h2>数据源监控</h2>
        </div>
        <div class="table-tools">
          <label class="sr-only" for="sourceFilter">筛选数据源</label>
          <input id="sourceFilter" type="search" placeholder="筛选模块、来源或适配器">
          <select id="sourceStatusFilter" aria-label="按状态筛选">
            <option value="">全部状态</option>
            <option value="success">成功</option>
            <option value="pending">待执行</option>
            <option value="failed">失败</option>
            <option value="disabled">已停用</option>
          </select>
          <select id="sourceAdapterFilter" aria-label="按适配器筛选">
            <option value="">全部适配器</option>
          </select>
          <select id="sourceBaselineFilter" aria-label="按基线筛选">
            <option value="">全部基线</option>
            <option value="present">有基线</option>
            <option value="absent">无基线</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table class="source-table">
          <thead>
            <tr>
              <th>模块 / 数据源</th>
              <th>适配器</th>
              <th>计划</th>
              <th>状态</th>
              <th>可达性</th>
              <th>基线</th>
              <th>基线时间</th>
              <th>最近执行</th>
            </tr>
          </thead>
          <tbody id="sourceTable"></tbody>
        </table>
      </div>
      <p id="sourceEmpty" class="empty-state" hidden>没有符合条件的数据源。</p>
    </section>

    <section class="tab-panel" id="panel-coverage" data-tab-panel="coverage" hidden>
      <div class="section-heading section-heading-wrap">
        <div>
          <h2>Way 模块对照</h2>
        </div>
        <div class="table-tools" id="coverageFilters">
          <select id="coverageModuleFilter" aria-label="按模块筛选">
            <option value="">全部模块</option>
          </select>
          <input id="coverageQuery" type="search" placeholder="筛选条目或原因" aria-label="筛选对照条目">
          <button type="button" data-coverage="all">全部</button>
          <button type="button" data-coverage="updating">更新中</button>
          <button type="button" data-coverage="registered">已登记</button>
          <button type="button" data-coverage="excluded">不更新</button>
          <button type="button" data-coverage="unregistered">未登记</button>
        </div>
      </div>
      <div id="coverageModules"></div>
    </section>

    <section class="tab-panel" id="panel-reports" data-tab-panel="reports" hidden>
      <div class="section-heading section-heading-wrap">
        <div>
          <h2>历史报告</h2>
        </div>
        <div class="table-tools">
          <input id="reportDate" type="search" placeholder="筛选日期" aria-label="筛选报告日期">
          <select id="reportStatus" aria-label="按报告状态筛选">
            <option value="">全部状态</option>
            <option value="success">成功</option>
            <option value="failed">失败</option>
          </select>
        </div>
      </div>
      <div id="reportList" class="report-list"></div>
    </section>

    <section class="tab-panel" id="panel-config" data-tab-panel="config" hidden>
      <div class="section-heading">
        <h2>翻译提供方</h2>
      </div>
      <div id="providers" class="provider-grid"></div>
    </section>

    <div id="loadError" class="error-panel" hidden></div>
  </main>
  <script src="./monitor.js?v=20260923-tabs"></script>
</body>
</html>
